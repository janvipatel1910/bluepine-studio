<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saffron Table – order at your table (demo)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FBF6EE;--surface:#fff;--ink:#2A1714;--muted:#7A645C;--line:#EADFD0;--accent:#B4372B;--soft:#F6E3D2;--display:'Fraunces',Georgia,serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-bottom:120px}
.app{max-width:560px;margin:0 auto}
.ribbon{background:var(--ink);color:var(--bg);font-size:.78rem;text-align:center;padding:7px 14px}
.ribbon a{color:inherit;font-weight:600}
header{padding:20px 18px 14px;display:grid;gap:4px;background:var(--accent);color:#fff}
header h1{font:700 1.6rem/1.1 var(--display);margin:0}
header p{margin:0;opacity:.85;font-size:.92rem}
.table-no{display:inline-block;background:#fff;color:var(--accent);font-weight:700;font-size:.82rem;padding:4px 10px;border-radius:999px;justify-self:start;margin-bottom:6px}
.help{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.help button{font:600 .95rem var(--body);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.help button.sent{border-color:var(--accent);color:var(--accent)}
.cats{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.cats a{flex:none;text-decoration:none;font:600 .88rem var(--body);padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
section{padding:8px 18px}
h2{font:700 1.25rem var(--display);margin:18px 0 6px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px dashed var(--line);align-items:center}
.item h3{margin:0;font-size:1rem}
.item p{margin:0;color:var(--muted);font-size:.86rem;grid-column:1}
.item .pr{font-weight:700;font-size:.92rem}
.tag{font:700 .62rem var(--body);padding:3px 5px;border-radius:5px;background:var(--soft);color:var(--accent);margin-left:5px;vertical-align:middle}
.step{grid-row:1/span 3;grid-column:2;display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font:700 1.1rem var(--body);cursor:pointer;line-height:1}
.step button.add{background:var(--accent);color:#fff}
.step span{min-width:16px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:10}
.bar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:528px;margin:0 auto;font:600 1rem var(--body);padding:15px 18px;border-radius:14px;border:0;background:var(--ink);color:#fff;cursor:pointer}
.bar button:disabled{opacity:.45;cursor:default}
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(42,23,20,.45)}
.sheet.open{display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet h2{margin:0}
.line{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.line.total{font-weight:700;font-size:1.05rem;border-top:1px solid var(--line);padding-top:10px}
.sheet textarea{font:400 .95rem var(--body);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical}
.btn{font:600 1rem var(--body);padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--muted);font-size:.86rem}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);transition:transform .25s;z-index:30;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:.92rem;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.status{margin:14px 18px 0;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.9rem;display:none}
</style>
</head>
<body>
<div class="app">
<div class="ribbon">Demo of a QR table menu. Made-up restaurant. Built by <a href="../../">Bluepine Studio</a>.</div>
<header>
  <span class="table-no" id="tableNo">Table 5</span>
  <h1>Saffron Table</h1>
  <p>Order from your phone. A waiter will bring everything to your table.</p>
</header>
<div class="help">
  <button id="callWaiter" type="button">🙋 Call waiter</button>
  <button id="askBill" type="button">🧾 Ask for the bill</button>
</div>
<div class="status" id="status"></div>
<nav class="cats" id="cats"></nav>
<div id="menu"></div>
</div>

<div class="bar"><button id="viewOrder" type="button" disabled><span id="barCount">Your order is empty</span><span id="barTotal"></span></button></div>

<div class="sheet" id="orderSheet" role="dialog" aria-modal="true" aria-labelledby="osTitle"><div class="in">
  <h2 id="osTitle">Your order</h2>
  <div id="osLines"></div>
  <label class="muted" for="note">Notes for the kitchen</label>
  <textarea id="note" rows="2" placeholder="Allergies, spice level, no onion…"></textarea>
  <button class="btn primary" id="sendOrder" type="button">Send order to kitchen</button>
  <button class="btn" data-close type="button">Keep browsing</button>
</div></div>

<div class="sheet" id="billSheet" role="dialog" aria-modal="true" aria-labelledby="bsTitle"><div class="in">
  <h2 id="bsTitle">Your bill</h2>
  <div id="bsLines"></div>
  <label class="line"><span><input type="checkbox" id="service" checked> Optional service charge (10%)</span><span id="svc"></span></label>
  <div class="line total"><span>Total</span><span id="bsTotal"></span></div>
  <p class="muted">A waiter is on the way with the card machine. You can also pay at the counter.</p>
  <button class="btn" data-close type="button">Close</button>
</div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var MENU=[
 ["Starters",[["Onion bhaji",5.5,"Crispy onion fritters, tamarind chutney",["VG"]],["Paneer tikka",7.5,"Chargrilled paneer, mint yoghurt",["V"]],["Chicken 65",7.95,"Spicy fried chicken, curry leaves",[]],["Pani puri",5.95,"Six crisp shells, spiced water",["V"]]]],
 ["Mains",[["Butter chicken",13.5,"Tandoori chicken, tomato and butter sauce",[]],["Lamb rogan josh",14.95,"Slow-cooked lamb, Kashmiri chilli",[]],["Dal makhani",10.5,"Black lentils simmered overnight",["V"]],["Chana masala",9.95,"Chickpeas, onion, tomato, ginger",["VG"]]]],
 ["Breads & rice",[["Garlic naan",3.5,"From the tandoor",["V"]],["Tandoori roti",2.5,"Wholewheat flatbread",["VG"]],["Jeera rice",3.95,"Basmati with cumin",["VG"]]]],
 ["Desserts",[["Gulab jamun",4.95,"Warm, with vanilla ice cream",["V"]],["Kulfi",4.5,"Pistachio",["V"]]]],
 ["Drinks",[["Mango lassi",3.95,"Alphonso mango",["V"]],["Masala chai",2.95,"Fresh spices",["V"]],["Soft drink",2.5,"Cola, lemonade or orange",["VG"]]]]
];
var table=(new URLSearchParams(location.search).get("t")||"5").replace(/[^0-9A-Za-z]/g,"").slice(0,4)||"5";
document.getElementById("tableNo").textContent="Table "+table;
var cart={},sent=[];
var gbp=function(n){return "£"+n.toFixed(2)};
var esc=function(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")};
var cats=document.getElementById("cats"),menu=document.getElementById("menu");
MENU.forEach(function(g,gi){
  cats.insertAdjacentHTML("beforeend",'<a href="#c'+gi+'">'+esc(g[0])+'</a>');
  var h='<section id="c'+gi+'"><h2>'+esc(g[0])+'</h2>';
  g[1].forEach(function(it,ii){
    var id=gi+"-"+ii,tags=it[3].map(function(t){return '<span class="tag">'+t+'</span>'}).join("");
    h+='<div class="item"><h3>'+esc(it[0])+tags+'</h3><p>'+esc(it[2])+'</p><span class="pr">'+gbp(it[1])+'</span>'+
       '<div class="step" data-id="'+id+'"><button type="button" class="minus" aria-label="Remove one '+esc(it[0])+'" hidden>−</button><span hidden>0</span><button type="button" class="add" aria-label="Add '+esc(it[0])+'">+</button></div></div>';
  });
  menu.insertAdjacentHTML("beforeend",h+"</section>");
});
function item(id){var p=id.split("-");return MENU[+p[0]][1][+p[1]]}
function render(){
  var n=0,t=0;
  Object.keys(cart).forEach(function(id){n+=cart[id];t+=cart[id]*item(id)[1]});
  document.querySelectorAll(".step").forEach(function(s){
    var q=cart[s.dataset.id]||0;s.querySelector("span").textContent=q;
    s.querySelector("span").hidden=!q;s.querySelector(".minus").hidden=!q;
  });
  var b=document.getElementById("viewOrder");b.disabled=!n;
  document.getElementById("barCount").textContent=n?"View order · "+n+" item"+(n>1?"s":""):"Your order is empty";
  document.getElementById("barTotal").textContent=n?gbp(t):"";
}
menu.addEventListener("click",function(e){
  var s=e.target.closest(".step");if(!s||e.target.tagName!=="BUTTON")return;
  var id=s.dataset.id;cart[id]=(cart[id]||0)+(e.target.classList.contains("add")?1:-1);
  if(cart[id]<=0)delete cart[id];render();
});
function lines(list){return list.map(function(l){return '<div class="line"><span>'+l[1]+' × '+esc(l[0])+'</span><span>'+gbp(l[1]*l[2])+'</span></div>'}).join("")}
function open(id){document.getElementById(id).classList.add("open")}
document.querySelectorAll(".sheet").forEach(function(s){s.addEventListener("click",function(e){if(e.target===s||e.target.hasAttribute("data-close"))s.classList.remove("open")})});
document.getElementById("viewOrder").addEventListener("click",function(){
  var l=Object.keys(cart).map(function(id){var it=item(id);return [it[0],cart[id],it[1]]});
  var t=l.reduce(function(a,x){return a+x[1]*x[2]},0);
  document.getElementById("osLines").innerHTML=lines(l)+'<div class="line total"><span>Order total</span><span>'+gbp(t)+'</span></div>';
  open("orderSheet");
});
var toastT;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},3200)}
function status(m){var s=document.getElementById("status");s.textContent=m;s.style.display="block"}
document.getElementById("sendOrder").addEventListener("click",function(){
  Object.keys(cart).forEach(function(id){var it=item(id);sent.push([it[0],cart[id],it[1]])});
  cart={};document.getElementById("note").value="";render();
  document.getElementById("orderSheet").classList.remove("open");
  toast("Order sent to the kitchen for table "+table+" (demo)");
  status("✅ Your order has been received. Add more any time.");
});
document.getElementById("callWaiter").addEventListener("click",function(){
  this.classList.add("sent");this.textContent="🙋 Waiter called";
  toast("A waiter is coming to table "+table+" (demo)");
});
function bill(){
  var sub=sent.reduce(function(a,x){return a+x[1]*x[2]},0),svc=document.getElementById("service").checked?sub*.1:0;
  document.getElementById("bsLines").innerHTML=sent.length?lines(sent)+'<div class="line"><span>Subtotal</span><span>'+gbp(sub)+'</span></div>':'<p class="muted">Nothing ordered yet. Add dishes and send your order first.</p>';
  document.getElementById("svc").textContent=gbp(svc);
  document.getElementById("bsTotal").textContent=gbp(sub+svc);
}
document.getElementById("service").addEventListener("change",bill);
document.getElementById("askBill").addEventListener("click",function(){bill();open("billSheet");if(sent.length)toast("Bill requested for table "+table+" (demo)")});
render();
</script>
</body>
</html>
